# Builds the launcher for every supported platform.
# A push of a tag that starts with 'v' (e.g. v3.0.0) additionally creates a GitHub release
# with the zipped builds attached. The workflow can also be started by hand from the Actions tab.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Self contained, so the users do not have to install .NET themselves.
      - name: Publish
        run: dotnet publish FlyffUniverseLauncher/FlyffUniverseLauncher.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.runtime }}

      - name: Zip
        shell: bash
        run: |
          cd publish/${{ matrix.runtime }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../FlyffUniverseLauncher-${{ matrix.runtime }}.zip .
          else
            zip -r ../../FlyffUniverseLauncher-${{ matrix.runtime }}.zip .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FlyffUniverseLauncher-${{ matrix.runtime }}
          path: FlyffUniverseLauncher-${{ matrix.runtime }}.zip

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
